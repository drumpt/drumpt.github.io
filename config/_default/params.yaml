# Wowchemy site parameters. Only settings that differ from the theme defaults.

appearance:
  theme_day: custom_green    # data/themes/custom_green.toml (light + dark)
  theme_night: custom_green
  font: inter                # data/fonts/inter.toml
  font_size: s

marketing:
  seo:
    site_type: Person
    org_name: University of Wisconsin–Madison
    description: Changhun Kim is a Ph.D. student in Computer Science at the University of Wisconsin–Madison, working on the algorithmic and theoretical foundations of deep generative models.
    twitter: hooni_ne

header:
  navbar:
    enable: true
    align: l
    show_logo: true
    show_language: false
    show_day_night: true     # rendered as a single toggle (components/headers/navbar.html)
    show_search: false
    highlight_active_link: true

footer:
  block: minimal             # the footer itself is emptied in site_footer.html

locale:
  date_format: Jan 2, 2006
  time_format: 3:04 PM
  address_format: en-us

features:
  math:
    enable: false
  privacy_pack:
    enable: false
  search:
    provider: ''             # no search: skips Fuse.js, mark.js and index.json

extensions:
  academicons:
    enable: true             # Google Scholar and CV icons
