# Hugo configuration. The theme (Wowchemy v5) is vendored under _vendor/.

title: Changhun Kim
baseURL: https://changhun.kim/

defaultContentLanguage: en
removePathAccents: true
enableEmoji: true
enableRobotsTXT: true
disableAliases: true

module:
  imports:
    - path: github.com/wowchemy/wowchemy-hugo-themes/modules/wowchemy/v5

# Everything lives on the home page. The only taxonomy is authors, which the
# theme uses to resolve and highlight author names; no tag or category pages.
taxonomies:
  author: authors

outputs:
  home: [HTML, RSS, WebAppManifest]
  section: [HTML]

imaging:
  resampleFilter: lanczos
  quality: 100
  anchor: smart

timeout: 10m

# Let the theme merge its own defaults into these.
markup:
  _merge: deep
security:
  _merge: deep
sitemap:
  _merge: deep
minify:
  _merge: deep
