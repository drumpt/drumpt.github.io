name: Check links

# Weekly check of every link on the live site. Broken links open (or add to)
# an issue, so moved lab pages and dead arXiv/GitHub links do not go unnoticed.
on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays, 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links on changhun.kim
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 403/429/999: sites that block bots (Google Scholar, LinkedIn, X)
          # answer this way even when the page is fine.
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept 200..=299,403,429,999
            https://changhun.kim/
          fail: false

      - name: Report broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links on changhun.kim
          content-filepath: ./lychee/out.md
