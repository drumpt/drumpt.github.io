# Theme metadata
name = "Forest"

[light]
  # Primary
  primary = "#2c6941"

  # Menu
  menu_primary = "#ffffff"
  menu_text = "rgba(0, 0, 0, 0.62)"
  menu_text_active = "#2c6941"
  menu_title = "#1c2a22"

  # Home sections
  home_section_odd = "rgb(255, 255, 255)"
  home_section_even = "rgb(255, 255, 255)"

[dark]
  # Primary: a lighter forest green that stays readable on dark grounds
  primary = "#7cc493"

  # Menu
  menu_primary = "#1c1b18"
  menu_text = "rgba(255, 255, 255, 0.72)"
  menu_text_active = "#ffffff"
  menu_title = "#ffffff"

  # Background and home sections
  background = "#181715"
  home_section_odd = "#181715"
  home_section_even = "#181715"
